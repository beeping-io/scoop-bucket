# 🥄 Auto-update — sync `bucket/beeping-cli.json` to a new beeping-cli release.
#
# BEE-1783 — mirror of BEE-1782 (Homebrew tap auto-update) retargeted
# at the Scoop JSON manifest schema. The canonical release flow:
#
#   1. `beeping-io/beeping-cli` publishes a tag `v<X.Y.Z>` via release-please.
#   2. That repo's `release.yml` builds + signs + publishes assets
#      (including `SHA256SUMS` with one line per cross-platform binary).
#   3. After publish, beeping-cli fires a `repository_dispatch` event with
#      `event_type=beeping-cli-released` and `client_payload={tag}` to
#      THIS repo (in parallel with the Homebrew tap dispatch).
#   4. This workflow downloads `SHA256SUMS` for that tag, rewrites
#      `bucket/beeping-cli.json` with the real Windows ZIP hash + new
#      version + URL + extract_dir, and commits to `develop`.
#
# Solo-developer note: pushes directly to `develop` (no PR cycle) because
# the diff is mechanically generated + the regen script is deterministic.
# Scoop's built-in `autoupdate` block in the manifest also lets
# `scoop update beeping-cli` resolve new versions independently as a
# fallback if the dispatch fails.

name: 🥄 Auto-update beeping-cli manifest

on:
  repository_dispatch:
    types: [beeping-cli-released]
  workflow_dispatch:
    inputs:
      tag:
        description: "beeping-cli release tag (with leading 'v', e.g. v0.1.2)"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: auto-update-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: 🔄 Regenerate bucket/beeping-cli.json
    runs-on: ubuntu-latest
    steps:
      - name: 🛂 Checkout bucket
        uses: actions/checkout@v5
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Resolve tag + version
        id: tag
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${DISPATCH_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag provided (dispatch nor input)"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Updating to tag=$TAG version=$VERSION"

      - name: ⬇️ Download SHA256SUMS for the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo beeping-io/beeping-cli \
            --pattern SHA256SUMS \
            --output SHA256SUMS \
            --clobber
          echo '--- SHA256SUMS ---'
          cat SHA256SUMS
          echo '--- end ---'

      - name: 🔄 Regenerate manifest
        run: |
          python3 scripts/regen-manifest.py \
            --manifest bucket/beeping-cli.json \
            --sha256sums SHA256SUMS \
            --version "${{ steps.tag.outputs.version }}"

      - name: 🧪 Validate JSON syntax
        run: python3 -m json.tool bucket/beeping-cli.json > /dev/null

      - name: 💾 Commit + push (if changed)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet bucket/beeping-cli.json; then
            echo "::notice::Manifest already up-to-date for $TAG; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/beeping-cli.json
          MSG="chore(manifest): sync beeping-cli to ${TAG} (BEE-1783) — auto-generated by .github/workflows/auto-update.yml"
          git commit -m "$MSG"
          git push origin develop
